<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Алексей | Контакты</title>
    
    <!-- Подключаем шрифт Segoe UI или аналог, если он не установлен локально -->
    <style>
        :root {
            --bg-color: #242424;
            --card-bg: #333333;
            --input-bg: #494949;
            --text-main: #ffffff;
            --text-secondary: #BDBDBD;
            --accent-green: #4CAF50;
            --accent-hover: #43A047;
            --border-radius: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh; /* Исправлено: было 10*vh */
            display: flex;
            justify-content: center; /* Исправлено: было justify*content */
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 540px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .header {
            text-align: center;
            padding: 30px 25px 15px;
        }

        .avatar {
            margin-bottom: 15px;
        }

        .avatar img {
            max-width: 220px;
            height: auto;
            border-radius: 50%; /* Опционально: круглая аватарка */
            border: 3px solid #4a4a4a;
        }

        .name {
            font-size: 34px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .location {
            color: var(--text-secondary);
            font-size: 15px;
            margin-bottom: 15px;
        }

        .about {
            color: #D0D0D0;
            line-height: 1.6;
            font-size: 15px;
        }

        .separator {
            height: 1px;
            background: #4a4a4a;
            margin: 25px 0;
        }

        .contact {
            padding: 0 25px 25px;
        }

        .contact-title {
            text-align: center;
            font-size: 22px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        input[type="text"],
        textarea {
            width: 100%;
            border: 1px solid transparent;
            border-radius: 7px;
            background: var(--input-bg);
            color: var(--text-main);
            padding: 12px 15px;
            margin-bottom: 15px;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent-green);
        }

        input::placeholder,
        textarea::placeholder {
            color: #B8B8B8;
        }

        textarea {
            resize: vertical;
            min-height: 130px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--accent-green);
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.3s ease;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .footer {
            text-align: center;
            color: #9E9E9E;
            font-size: 12px;
            margin-top: 20px;
        }

        /* Скрытие honeypot поля для ботов */
        [name="_honey"] {
            display: none;
        }
    </style>
</head>
